name: CI

on:
  push:
    branches: [main, phase5]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall src tests azure scripts
      - name: Test
        run: python -m pytest -q
      - name: Build container
        run: docker build --tag azure-cloud-intelligence-mcp:ci .
